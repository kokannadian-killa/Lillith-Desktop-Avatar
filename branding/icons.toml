# Lillith's icon set. Generated by branding/make-icons.py (edit SET there).
# Paths are relative to this file. `default` is used when config.toml has
# no `icon` key or names an unknown id.

default = "neon-sign"
sizes = [16, 24, 32, 48, 64, 128, 256]

[[icon]]
id = "neon-portrait"
name = "Neon Portrait"
master = "icons/neon-portrait/icon-1024.png"
png = "icons/neon-portrait/lillith-{size}.png"
ico = "icons/neon-portrait/neon-portrait.ico"
android = "@mipmap/ic_icon_neon_portrait"

