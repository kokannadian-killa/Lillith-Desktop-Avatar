name: Set up Lillith build
description: >
  System libraries (Wayland, xkbcommon, D-Bus, PulseAudio, ALSA, systemd)
  plus the pinned Rust 1.85 toolchain and cargo cache. Shared by every CI job
  that compiles, so the jobs can't drift apart again.
inputs:
  cache-key:
    description: Extra key so each job keeps its own cargo cache
    required: false
    default: default
  smoke-deps:
    description: Also install what tools/smoke.sh needs (Xvfb, xdotool, xwininfo, ffmpeg, python3-pil)
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libxkbcommon-dev libwayland-dev libdbus-1-dev \
          libpulse-dev libsystemd-dev libasound2-dev
    - name: Install smoke-test tools
      if: inputs.smoke-deps == 'true'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          xvfb xdotool x11-utils ffmpeg python3 python3-pil \
          libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2 \
          libgl1 libegl1 libgl1-mesa-dri
    - uses: dtolnay/rust-toolchain@1.85
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
