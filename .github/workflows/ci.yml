name: CI

on:
  push:
    branches: [main, scaffold/rust-workspace, "ci/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Toolchain is pinned to 1.85 (same as the local gate); newer clippy adds a
# float lint the codebase doesn't follow yet. System libraries and the
# toolchain come from .github/actions/setup-lillith so every compiling job
# gets the same setup.
#
# Git LFS art (~460 MB): the Android engine tests render the real generated
# set, so the test job needs it. It's fetched once and kept in the Actions
# cache (keyed on the LFS object list), so later runs only download objects
# that changed and don't burn the repo's LFS bandwidth on every push. The
# all-features clippy job doesn't need art and skips LFS entirely.

jobs:
  check:
    name: fmt + clippy + build + test (default features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: List Git LFS objects
        # master.zip (585 MB asset pack for downloads) is not needed by CI.
        run: git lfs ls-files --long --exclude=master.zip | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore Git LFS cache
        id: lfs-cache
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Fetch Git LFS art
        run: git lfs pull --exclude=master.zip
      # Save right away (not in a post step) so a later test failure doesn't
      # throw away the ~460 MB download.
      - name: Save Git LFS cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - uses: ./.github/actions/setup-lillith
        with:
          cache-key: default
          smoke-deps: "true"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo build
        run: cargo build --workspace --locked
      # Headless end-to-end check of the binary just built: under Xvfb with a
      # stub llama-server on 127.0.0.1, she maps a non-black first frame, the
      # right-click menu opens and draws, and `lillith chat` round-trips.
      - name: smoke test (Xvfb)
        run: SMOKE_NO_BUILD=1 tools/smoke.sh
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: target/smoke
          if-no-files-found: ignore
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  full-features:
    name: clippy (all features, system libs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: ./.github/actions/setup-lillith
        with:
          cache-key: all-features
      - name: cargo clippy --all-features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  windows:
    name: windows (MSVC build + tests, install.ps1 on PowerShell 5.1)
    runs-on: windows-latest
    env:
      # Short target folder: Windows' 260-character path limit.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # Windows PowerShell 5.1 (shell: powershell), the one install.bat runs:
      # parse every .ps1, then install.ps1 -DryRun / -Yes with a fake gh that
      # writes to stderr and exits 1.
      - name: install.ps1 smoke (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\install-ps1-smoke.ps1
      - name: install.ps1 smoke (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools\windows\install-ps1-smoke.ps1
      - name: .bat/.cmd files have CRLF line endings
        shell: pwsh
        run: |
          $bad = git ls-files '*.bat' '*.cmd' '*.ps1' | Where-Object { $b = [IO.File]::ReadAllBytes($_); $lf = ($b | Where-Object { $_ -eq 10 }).Count; $crlf = ([regex]::Matches([Text.Encoding]::ASCII.GetString($b), "`r`n")).Count; $lf -ne $crlf }
          if ($bad) { "LF-only lines in: $bad"; exit 1 }
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: cargo build --release (lillith, settings, admin)
        run: |
          cargo build --release --locked -p lillith --no-default-features --features windows
          cargo build --release --locked -p lillith-settings-gui -p lillith-admin
      - name: cargo test (core, voice, settings-gui)
        run: cargo test --locked -p lillith-core -p lillith-voice -p lillith-settings-gui
