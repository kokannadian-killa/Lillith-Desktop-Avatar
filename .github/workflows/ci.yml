name: CI

on:
  push:
    branches: [main, scaffold/rust-workspace, "ci/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Toolchain is pinned to 1.85 (same as the local gate); newer clippy adds a
# float lint the codebase doesn't follow yet. System libraries and the
# toolchain come from .github/actions/setup-lillith so every compiling job
# gets the same setup.
#
# Git LFS art (~460 MB): the Android engine tests render the real generated
# set, so the test job needs it. It's fetched once and kept in the Actions
# cache (keyed on the LFS object list), so later runs only download objects
# that changed and don't burn the repo's LFS bandwidth on every push. The
# all-features clippy job doesn't need art and skips LFS entirely.

jobs:
  check:
    name: fmt + clippy + build + test (default features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore Git LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Fetch Git LFS art
        run: git lfs pull
      - uses: ./.github/actions/setup-lillith
        with:
          cache-key: default
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo build
        run: cargo build --workspace --locked
      - name: cargo test
        run: cargo test --workspace --locked

  full-features:
    name: clippy (all features, system libs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: ./.github/actions/setup-lillith
        with:
          cache-key: all-features
      - name: cargo clippy --all-features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
