name: CI

on:
  push:
    branches: [main, scaffold/rust-workspace, "ci/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Toolchain is pinned to 1.85 (same as the local gate); newer clippy adds a
# float lint the codebase doesn't follow yet. System libraries and the
# toolchain come from .github/actions/setup-lillith so every compiling job
# gets the same setup.
#
# Git LFS art (~460 MB) is NOT fetched: tests that need the real generated
# set skip themselves when the sheets are only LFS pointers, which keeps CI
# from burning the repo's LFS bandwidth on every push.

jobs:
  check:
    name: fmt + clippy + build + test (default features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: ./.github/actions/setup-lillith
        with:
          cache-key: default
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo build
        run: cargo build --workspace --locked
      - name: cargo test
        run: cargo test --workspace --locked

  full-features:
    name: clippy (all features, system libs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: ./.github/actions/setup-lillith
        with:
          cache-key: all-features
      - name: cargo clippy --all-features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
