# DemonOS live: local-only image. releng's archiso.conf in this directory turns
# mDNS on, and its LLMNR responder listens on 0.0.0.0:5355 by default. Drop-ins
# are read in name order and later ones win, so this file is named zz-* to come
# after archiso.conf. It turns both LLMNR and mDNS off.
[Resolve]
LLMNR=no
MulticastDNS=no
