# DemonOS live: create the autologin user's home from /etc/skel at boot
# (mkarchiso can't chmod paths that don't exist in airootfs, and the live
# image never runs useradd). Runs before sddm via systemd-tmpfiles-setup.
C /home/demon - - - - /etc/skel
Z /home/demon - demon demon -
z /home/demon 0750 demon demon -
