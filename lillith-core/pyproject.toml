[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lillith-core"
version = "0.1.0"
description = "Local-only attachments and bot deployment for the Lillith desktop AI (DemonOS - Phantomcore)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
images = ["pillow"]
ocr = ["pytesseract"]
test = ["pytest"]

[project.scripts]
lillith-attach = "lillith_core.attachments.cli:main"
lillith-bot = "lillith_core.bots.cli:main"

[tool.setuptools.packages.find]
include = ["lillith_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
