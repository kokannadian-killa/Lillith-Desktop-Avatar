[workspace]
resolver = "3"
members = [
    "crates/lillith-core",
    "crates/lillith-anim",
    "crates/lillith-overlay",
    "crates/lillith-sense",
    "crates/lillith-mind",
    "crates/lillith-voice",
    "crates/lillith-panel",
    "crates/lillith-tray",
    "crates/lillith-setup",
    "apps/lillith",
    "tools/slice-sheets",
    "tools/import-manifest",
    "crates/lillith-theme",
    "crates/lillith-settings-gui",
    "android/rust",
]
default-members = [
    "crates/lillith-core",
    "crates/lillith-anim",
    "crates/lillith-overlay",
    "crates/lillith-sense",
    "crates/lillith-mind",
    "crates/lillith-voice",
    "crates/lillith-panel",
    "crates/lillith-tray",
    "crates/lillith-setup",
    "apps/lillith",
    "tools/slice-sheets",
    "tools/import-manifest",
    "crates/lillith-theme",
    "crates/lillith-settings-gui",
    "android/rust",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kokannadian-killa/Lillith-Desktop-Avatar"
authors = ["Ko Kannadian"]
publish = false

[workspace.dependencies]
# Internal crates
lillith-core = { path = "crates/lillith-core" }
lillith-anim = { path = "crates/lillith-anim" }
lillith-overlay = { path = "crates/lillith-overlay" }
lillith-sense = { path = "crates/lillith-sense" }
lillith-mind = { path = "crates/lillith-mind" }
lillith-voice = { path = "crates/lillith-voice" }
lillith-panel = { path = "crates/lillith-panel" }
lillith-tray = { path = "crates/lillith-tray" }
lillith-theme = { path = "crates/lillith-theme" }
lillith-settings-gui = { path = "crates/lillith-settings-gui" }
lillith-setup = { path = "crates/lillith-setup" }
lillith-android = { path = "android/rust" }

# Common
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
glam = "0.29"
regex = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Rendering / windowing (PLAN.md §2)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
ab_glyph = "0.2.32"
epaint_default_fonts = "0.31.1"
cosmic-text = "0.12"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
winit = "0.30"
softbuffer = "0.4"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ksni = "0.3"
ashpd = "0.10"

# Sensors
sysinfo = "0.33"
zbus = { version = "5", default-features = false, features = ["tokio"] }
notify = "8"
bluer = "0.17"
libpulse-binding = "2"
systemd = { version = "0.10", default-features = false }
wl-clipboard-rs = "0.9"
x11rb = "0.13"

# Mind / voice
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rodio = "0.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
