[package]
name = "lillith-settings-gui"
description = "Lillith's settings / options pop-up window (egui): Companion, Motion, Chat/Brain first-run setup wizard, Avatar, Voice, About and sealed add-in tabs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "lillith-settings"
path = "src/bin/lillith-settings.rs"

[features]
default = ["file-dialog"]
# Native "Browse…" through the XDG desktop portal (KDE/GNOME). Without it,
# paths are typed into a text field.
file-dialog = ["dep:rfd"]

[dependencies]
lillith-core.workspace = true
lillith-anim.workspace = true
lillith-setup.workspace = true
lillith-theme = { workspace = true, features = ["egui"] }
lillith-quantumsec.workspace = true
eframe.workspace = true
egui = { version = "0.31", default-features = false }
image.workspace = true
toml_edit = "0.22"
serde_json.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"], optional = true }

[target.'cfg(unix)'.dependencies]
# SIGTERM / killpg for cancelling a video import.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# CTRL_BREAK for cancelling a video import.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
