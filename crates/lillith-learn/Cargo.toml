[package]
name = "lillith-learn"
description = "Lillith's idle self-learning (P1): reads installed docs while the desktop is idle and writes small private notes. Fully local; no network but the loopback model server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
lillith-core.workspace = true
lillith-memory.workspace = true
lillith-mind.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# man/info pages are gzip (already in the lock through the image stack).
flate2 = "1"

[target.'cfg(unix)'.dependencies]
# setpriority / ioprio_set for the learner thread.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
rusqlite.workspace = true
