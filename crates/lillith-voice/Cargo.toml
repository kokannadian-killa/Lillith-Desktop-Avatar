[package]
name = "lillith-voice"
description = "Lillith's voice: TTS chain (piper → espeak-ng → spd-say), push-to-talk STT (whisper.cpp) and SFX playback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# rodio playback for SFX and TTS audio (needs libasound at build time).
audio = ["dep:rodio"]

[dependencies]
lillith-core.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
rodio = { workspace = true, optional = true }
