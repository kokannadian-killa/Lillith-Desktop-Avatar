[package]
name = "lillith-overlay"
description = "Transparent, always-on-top, click-through avatar overlay: wlr-layer-shell on KDE Plasma 6 Wayland with a winit/X11 fallback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Native Wayland layer-shell overlay (needs libxkbcommon at build time).
wayland = ["dep:smithay-client-toolkit", "dep:wayland-client"]
# winit + softbuffer fallback for X11/XWayland.
x11 = ["dep:winit", "dep:softbuffer", "dep:x11rb"]
# Speech-bubble text shaping.
text = ["dep:cosmic-text"]
# xdg-desktop-portal: GlobalShortcuts + Screenshot.
portal = ["dep:ashpd"]

[dependencies]
lillith-core.workspace = true
lillith-anim.workspace = true
# Toolkit-free palette + geometry only (no `egui` feature here).
lillith-theme.workspace = true
thiserror.workspace = true
tracing.workspace = true
tiny-skia.workspace = true
regex.workspace = true
smithay-client-toolkit = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
# Input shape (click-through) + pointer queries on the winit window.
x11rb = { workspace = true, optional = true, features = ["shape", "xfixes"] }
cosmic-text = { workspace = true, optional = true }
ashpd = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "x11_click_probe"
required-features = ["x11"]

[dev-dependencies]
image.workspace = true
