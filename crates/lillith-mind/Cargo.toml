[package]
name = "lillith-mind"
description = "Lillith's memory (SQLite), local LLM client (Ollama / llama-server), context builder and read-only tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
lillith-core.workspace = true
# Shared loopback-only URL validator (LocalUrl): the chat must never talk
# to anything but this computer.
lillith-setup.workspace = true
# Learning memory graph (`[memory]`, local SQLite, no network).
lillith-memory.workspace = true
rusqlite.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros"] }
