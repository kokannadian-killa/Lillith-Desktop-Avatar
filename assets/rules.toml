# ── Event reaction clips (assets/generated, `event_<name>`) ───────────────
# Rule event -> canonical event reaction clip in the generated manifest.
# Resolved by `RuleSet::event_clip`. A rule missing from this table has no
# event clip yet (it falls back to its `pose`). Full reconciliation, gaps and
# uncertain candidates: docs/EVENT_MAPPING.md. Do not map a rule here unless
# the clip shows the same thing; keep candidates in that doc instead.
[event_clips]
"cpu.high"           = "event_cpu_busy"        # pose busy; CPU chip heating
"system.status"      = "event_diagnostics"     # pose diagnostics; monitor ECG
"battery.low"        = "event_battery_low"     # pose battery_low
"brightness.changed" = "event_brightness"      # pose brightness
"wifi.changed"       = "event_wifi"            # pose wifi
"net.restored"       = "event_wifi"            # rule also uses pose wifi
"bt.paired"          = "event_bluetooth"       # pose bluetooth
"firewall.blocked"   = "event_firewall_block"  # pose firewall
"volume.changed"     = "event_volume"          # pose volume
"usb.removed"        = "event_usb_eject"       # stick rises under eject symbol, wave bye
"print.job"          = "event_printing"        # pose printing
"archive.created"    = "event_archiving"       # pose compress; files into a zipped box
"cloud.sync"         = "event_cloud_sync"      # pose cloud_sync
"trash.added"        = "event_recycle_bin"     # pose recycle; paper into bin
"screenshot.taken"   = "event_screenshot"      # pose screenshot; flash + thumbnail
"clipboard.copied"   = "event_clipboard"       # pose clipboard
"notify.received"    = "event_notification"    # pose dismiss_notif; bell with badge
"calendar.reminder"  = "event_calendar"        # pose calendar
"window.opened.app"  = "event_window_open"     # generic app window (other window.opened.* keep their poses)
"window.closed"      = "event_window_close"    # NOTE: rule pose/line is knife "Gotcha!", clip is a wave bye
"window.minimized"   = "event_window_minimize" # pose minimize
"window.private"     = "event_incognito"       # pose private; glasses + fade to ~45%
"app.loading"        = "event_loading"         # pose loading
"journal.error"      = "event_error"           # pose error
"app.crash"          = "event_error"           # pose error
"help.requested"     = "event_help"            # pose help
"input.click.middle" = "event_help"            # pose help (middle click = help)

# ── Key map (README-SP; active only while she has keyboard focus) ─────────
# Each entry is either { pose = "<pose>" } or { action = "<action>" }.
[keys]
T = { pose = "dual_tail" }
K = { pose = "hacking" }
H = { pose = "help" }
R = { action = "random_reaction" }
C = { action = "cycle_pose" }
M = { action = "toggle_mute" }
S = { action = "sleep" }
W = { pose = "wifi" }
V = { pose = "vpn" }
B = { pose = "battery_low" }
A = { pose = "alert" }          # v09 also used A/S for opacity; README-SP wins
E = { pose = "error" }
F = { pose = "firewall" }
P = { pose = "private" }
"0" = { pose = "running" }
"1" = { pose = "htop" }
"2" = { pose = "unknown_net_files_terminal" }  # "task manager" pose unresolved
"3" = { pose = "unknown_peek_over_laptop" }    # "settings" pose unresolved
"4" = { pose = "tools" }
"5" = { pose = "screenshot" }
"6" = { pose = "calendar" }
"7" = { pose = "clipboard" }
"8" = { pose = "volume" }
"9" = { pose = "brightness" }
D = { pose = "diagnostics" }
N = { pose = "bluetooth" }
U = { pose = "cloud_sync" }
J = { pose = "bookmark" }
X = { pose = "compress" }
Z = { pose = "loading" }        # "restart" pose unresolved
Y = { action = "open_chat" }
Enter = { action = "open_chat" }
I = { action = "voice_listen" }
Q = { action = "quit" }
Escape = { action = "close_chat_or_quit" }
