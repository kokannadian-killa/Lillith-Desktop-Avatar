# Lillith event -> reaction rules.
#
# Source: docs/FEATURES.md §4 (system monitor events -> pose mappings) and
# docs/PLAN.md §3.2 (gesture / line / mood / SFX columns).
# Loaded by `lillith_core::rules::RuleSet`. Unit-tested in that crate, so a
# typo here fails `cargo test`.
#
# Fields per [[rule]]:
#   event       event name emitted on the bus (lillith-sense or the injector)
#   pose        clean pose name (assets/source/poses/NN_<pose>.*)
#   then        optional follow-up pose once `pose` finishes
#   gesture     procedural gesture (aether_animator names), optional
#   line        speech-bubble line, optional ("{summary}" = notification text)
#   mood        Playful | Happy | Mischievous | Alert | Sleepy, optional
#   sfx         README_SOUNDS cue name, optional
#   priority    0 (ambient) .. 255 (must show); higher interrupts lower
#   cooldown_s  minimum seconds between two firings of this rule
#   source      where the event comes from in Rust (documentation only)
#   status      prototype status from FEATURES.md (documentation only)
#   enabled     default true; set false to keep a rule as a quiet indicator

[thresholds]
cpu_high_percent = 72.0      # Python prototype (mod_system_monitor); PLAN.md §3.2 suggests 68
cpu_high_sustain_s = 10.0
cpu_poll_s = 5.5
ram_high_percent = 85.0      # guess
battery_low_percent = 15.0
focus_long_work_min = 50.0   # guess
idle_sleepy_s = 300.0        # guess
idle_asleep_s = 900.0        # guess
auto_gesture_cooldown_s = 2.5
secret_sequence_window_s = 3.0

# ── System load ───────────────────────────────────────────────────────────
[[rule]]
event = "cpu.high"
pose = "busy"
then = "alert"
gesture = "bounce"
line = "System's getting sharp… I like the heat."
mood = "Alert"
sfx = "alert"
priority = 60
cooldown_s = 60.0
source = "sysinfo"
status = "PY"

[[rule]]
event = "ram.high"
pose = "htop"
gesture = "think"
mood = "Alert"
sfx = "alert"
priority = 55
cooldown_s = 120.0
source = "sysinfo"
status = "SPEC"

[[rule]]
event = "system.status"
pose = "diagnostics"
priority = 40
source = "sysinfo (chat command / key D)"
status = "PY-missing"

