# Example ~/.config/lillith/config.toml. Every key is optional; missing keys
# use the defaults. "Open settings" in her right-click menu creates the file
# from a template (with this [voice] block, commented) if it doesn't exist.

# mode = "stay"          # stay | wander | follow
# scale = 0.55           # Small 0.45 / Normal 0.55 / Large 0.75 (the menu saves this)
# muted = false          # mutes SFX and voice

# Voice (text-to-speech, offline). Needs piper, espeak-ng or spd-say on PATH;
# with none installed she stays silent. See INSTALL.md / HANDOFF for engines.
# [voice]
# enabled = true
# engine = "auto"        # auto | piper | espeak-ng | spd-say | none   (auto: piper → espeak-ng → spd-say → silent)
# model = "~/.local/share/lillith/piper/en_US-amy-medium.onnx"
# voice = "female1"      # optional (spd-say -t / espeak-ng -v)
# rate = 1.0             # 0.5..2.0
# volume = 0.8           # 0..1
# mute = false
# cooldown_s = 8.0
# repeat_cooldown_s = 90.0
# queue = 3
# max_chars = 240
# player = "auto"        # auto | aplay | paplay  (piper only)
