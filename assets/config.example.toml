# Example ~/.config/lillith/config.toml. Every key is optional; missing keys
# use the defaults. "Open settings" in her right-click menu creates the file
# from a template (with this [voice] block, commented) if it doesn't exist.

# mode = "wander"        # wander (default) | stay | follow
# scale = 0.55           # Small 0.45 / Normal 0.55 / Large 0.75 (the menu saves this)
# muted = false          # mutes SFX and voice
# icon = "phantomcore-red"  # app icon: menu entry + desktop / Start-menu shortcuts.
#                         # Settings > Icon, right-click > Icon…, or `lillith icon ID`.
#                         # ids: neon-portrait wink-chibi phantomcore-red demonos-green-chibi
#                         #   neon-sign demonos-emblem hooded-phantom green-hologram chibi-perched
#                         #   kiss-skullframe winged-sigil pixel-chibi glitch chibi-terminal classic

# Voice (text-to-speech, offline). Needs piper, espeak-ng or spd-say on PATH;
# with none installed she stays silent. See INSTALL.md / HANDOFF for engines.
# [voice]
# enabled = true
# engine = "auto"        # auto | piper | espeak-ng | spd-say | none   (auto: piper → espeak-ng → spd-say → silent)
# model = "~/.local/share/lillith/piper/en_US-amy-medium.onnx"
# model = "~/.local/share/lillith-voice/lillith.onnx"   # Ko's cloned voice (lillith-voice kit, install.sh --piper-shim; engine = "piper")
# voice = "female1"      # optional (spd-say -t / espeak-ng -v)
# rate = 1.0             # 0.5..2.0
# volume = 0.8           # 0..1
# mute = false
# cooldown_s = 8.0
# repeat_cooldown_s = 90.0
# queue = 3
# max_chars = 240
# player = "auto"        # auto | aplay | paplay  (piper only)

# Learning memory (local SQLite graph, no network). ON by default: she learns
# what you like, your habits and which fixes worked, and slips a short
# "[Memory]" note (~300 tokens max) into each chat prompt.
# Turn it OFF with `enabled = false` (then nothing is read or written).
# Forget from chat: "forget everything", "forget about <topic>",
# "forget the last 30 minutes" (rows are deleted and the file vacuumed).
# The safeword ("red" / "OOC: stop") is never stored.
# [memory]
# enabled = true
# db_path = ""            # empty = ~/.local/share/lillith/memory.db ($XDG_DATA_HOME aware)
# half_life_days = 14.0   # unused memories fade by half every N days
# top_k = 6               # memories injected per chat turn
# max_context_tokens = 300
# prune_below = 0.05      # memories weaker than this are deleted
# max_nodes = 5000
# max_events = 5000       # habit-mining event log cap
