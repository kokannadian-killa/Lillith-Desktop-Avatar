# --- Preview renderer hints (physics-lab/render_preview.py). Engine-side renderer should use the same
# mapping once it does localized warps. All px on the 400x400 canvas. Warps are backward displacement
# maps with gaussian / smoothstep feathering (no hard seams).
[render]
fps = 30
bg = [128, 128, 128]
output_scale = 2                 # MP4 upscale for viewing (GIF stays 1x)
planted = true                   # root_x/root_y/hip act above the feet only (feet stay on baseline 392)
plant_ramp = "hip"               # displacement weight 0 at baseline -> 1 at hip_point.y and above
angle_pivot = "feet"
angle_planted = true            # rotation fades in with the plant weight (0 at soles -> 1 at hip): rigid tilt lifted one sole ~1 px             # rotate/scale about feet anchor [200,392]
angle_visual_scale = 1.0         # multiplier on the angle channel for the whole-sprite lean
chest_visual_cap_px = 3.0        # soft cap (tanh) == [chest].render_visual_cap_px
chest_center_dy = -12.0          # chest_point is the underbust gem; cups sit ~12 px higher
chest_sigma = [18.0, 13.0]       # gaussian sx, sy (px)
chest_squash = 0.35              # extra vertical squash/stretch inside the chest blob, per px of offset
pigtail_sigma_x = 14.0          # outboard half-width (px)
pigtail_sigma_inboard = 5.0     # toward the face: tight so the head/eyes never warp
pigtail_tie_dy = -28.0           # ribbon tie relative to the pigtail point: weight 0 here ...
pigtail_full_dy = 15.0           # ... ramps to 1 here ...
pigtail_fade_dy = 40.0           # ... and fades out by here
pigtail_gain = 1.0
pigtail_cap_px = 8.0
pigtail_tip_lag_s = 0.08         # strand lag: tips use the pigtail trace delayed by this
pigtail_tip_mix = 0.4
pigtail_left_sign = 1.0         # both pigtails sway the same lateral direction (body-driven sway). [attachments] sign -1 (proposal) = mirrored spread/close flap; set -1.0 here to get that look
tail_sigma = 11.0
tail_gain = 0.35                 # clip already bakes ~3 px tail curl
tail_cap_px = 7.0
# Clips that ship without frame_points fall back to the idle anchors; per-clip fixes measured in the preview:
[render.anchor_overrides.event_cpu_busy]
tail_tip_point = [251, 168]     # facepalm pose curls the tail up; idle's [263, 250] missed the spade entirely
