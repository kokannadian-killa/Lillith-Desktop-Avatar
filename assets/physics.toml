# =============================================================================
# Lillith jiggle-physics config  (physics.toml, schema_version 1)
# AUTHORITATIVE COPY: /workspace/lillith/physics-lab/physics.toml
# Mirror (read-only copy): /workspace/lillith/assets/processed/physics/physics.toml
# Human-readable rationale + brief citations: assets/processed/physics/SPEC.md
#
# Compatible with repo crates/lillith-core/src/spring.rs (semi-implicit Euler,
# fixed 120 Hz sub-steps, impulses = velocity kicks, max_velocity/max_offset
# clamps, per-channel gain applied inside Physics::impulse).
#
# CHANNEL NAMES (exact, used everywhere in this file):
#   root_x, root_y, angle, scale, chest, pigtails
#   - "pigtails" == spring.rs Channel::Pigtail (serde "pigtail") == config.rs Springs.pig
#   ADDITIVE (not spring.rs channels; driven by the procedural overlay, see [tail]/[horn]):
#   tail_tip_x, tail_tip_y, horn_tilt
#
# UNITS: root_x/root_y/chest/pigtails in px (screen, +y down); angle in rad
#   (whole sprite about the feet anchor); scale is a multiplier (rest 1.0).
#   Impulse "strength" is channel-units/second BEFORE gains (same as repo
#   Physics::impulse(channel, strength) and lillith-anim Kick).
#   Brief cm -> px: see [units].
# =============================================================================

schema_version = 1
physics_hz = 120.0          # README-SP / PLAN §3.1: 120 Hz sub-steps

[units]
# 400 px sprite ~ 165 cm figure => 2.4 px/cm (sprite-native).
px_per_cm_sprite = 2.4
# Whole-sprite spring channels move the ENTIRE frame (no layered art yet,
# PLAN §3.1 design note), so brief amplitudes (written for video prompts,
# "very subtle") are halved for them: 1.2 px per brief-cm.
px_per_cm_motion = 1.2
# Brief degrees for head/torso -> whole-sprite rotation factor.
deg_scale_motion = 0.5

# --- Springs: README-SP defaults (stiffness k, damping c). Clamps = spring.rs Physics::new.
[springs.root_x]
stiffness = 48.0
damping = 10.0
max_velocity = 400.0
max_offset = 40.0
[springs.root_y]
stiffness = 48.0
damping = 10.0
max_velocity = 400.0
max_offset = 40.0
[springs.angle]
stiffness = 42.0
damping = 9.0
max_velocity = 4.0
max_offset = 0.35
[springs.scale]
stiffness = 55.0
damping = 11.0
max_velocity = 2.0
max_offset = 0.2
[springs.chest]
stiffness = 65.0
damping = 9.5
max_velocity = 120.0
max_offset = 12.0
[springs.pigtails]
stiffness = 32.0
damping = 6.5
max_velocity = 160.0
max_offset = 20.0

# --- Gains (README-SP config.ini): applied inside Physics::impulse.
[gains]
jiggle = 0.6          # root_x, root_y, angle, scale  (keep 0.50-0.75 per README-SP tips)
chest_bounce = 1.0    # chest
pigtail_sway = 0.9    # pigtails

# --- Breathing (phys_breathing.txt, phys_bikini_top_jiggle.txt, README-SP).
[breathing]
period_s = [3.5, 4.5]           # re-picked every cycle
# Phase ratios of one cycle (sum = 1.0). From brief mids: inhale 1.4, hold 0.4, exhale 1.6, settle 0.5 (=3.9 s).
inhale = 0.36
hold = 0.10
exhale = 0.41
settle = 0.13
shape = "eased"                 # "eased" (piecewise smoothstep, value in [-1,1]) or "sine" (repo Breath::value)
chest_amplitude_px = -0.6       # chest target = amp * value  (p2p 1.2 px; preview pass 2: 2.4 px p2p ate most of the 3 px visual cap and read as heaving). NEGATIVE: +chest = down (render convention), so inhale lifts the chest. Repo AnimatorConfig.breath_chest = +1.2 (sign differs, preview pass 2)
scale_amplitude = 0.006         # scale target = 1 + amp * value ; repo AnimatorConfig.breath_scale = 0.006
# Exhale->settle micro-bounce on the top: 0.3-0.5 cm => ~0.45 px peak.
exhale_bounce_chest = 7.5       # chest impulse at settle start
# Shoulders rise 3-5 mm on inhale / drop on exhale => soft pigtail ripple.
inhale_pigtails = 4.0           # pigtails impulse at inhale start
exhale_pigtails = -6.0          # pigtails impulse at exhale start ("secondary wave")

# --- Walk / run footfalls (PLAN §3.1 layer 1; lillith-anim animator.rs footfall_for).
[walk]
footfalls_per_cycle = 2
walk_footfall = { root_y = 10.0, chest = 22.0, pigtails = 18.0 }   # == repo footfall_for("walk*")
run_footfall  = { root_y = 30.0, chest = 45.0, pigtails = 35.0 }   # == repo footfall_for("run*")
alternate_pigtails = true       # pigtail kick sign alternates L/R foot (side-to-side sway)
start_tip_angle = 0.25          # angle impulse on walk start (sign = direction), negated on stop
stop_chest = 20.0               # chest impulse when stopping (momentum)
demo_speed_px_s = 60.0          # harness walk speed
demo_cycle_s = 1.1667           # canonical walk_right: 14 frames @ 12 fps (assets/generated/manifest.toml); run_right 10 @ 12 = 0.833 s

# --- Pigtails (phys_pigtail_top.bin.txt, phys_bikini_top_jiggle.txt master prompt).
[pigtails]
micro_sway_px = 1.5             # constant micro-sway 2-4 cm (p2p 3 cm * 1.2 / 2 ~ 1.8, trimmed)
micro_sway_period_s = 2.8       # deliberately NOT a breath multiple
velocity_coupling = 0.03        # target = -root_vx * k  (hair trails motion), px per (px/s)
velocity_clamp_px = 6.0
lag_s = 0.05                    # hair lag: pigtail kicks fire this long after the body kick
# Double-bounce on stronger taps ("quick double-bounce before settling").
double_bounce_delay_s = 0.55    # re-kick near the dip: 2nd lobe ~45% of 1st, 0.5 s after it, dip ~20% (preview pass 2; 0.40 merged into one long lobe on screen)
double_bounce_ratio = 0.5

# --- Chest / top jiggle (phys_bikini_top_jiggle.txt).
[chest]
secondary_delay_s = 0.12        # "0.1-0.2 s after the arm motion"
double_jiggle_delay_s = 0.40    # press-stab: jiggle -> settle to ~17% -> 2nd softer jiggle (~44% of 1st, 0.38 s later; preview pass 2, 0.30 only gave a shoulder)
double_jiggle_ratio = 0.5
light_tap_peak_px = 1.8         # 1-2 cm light tap (documentation; recipes below hit this)
strong_tap_peak_px = 3.6        # up to 3 cm press-stab
sympathetic_from_pigtails = 0.08  # fraction of every pigtail kick echoed into chest (pigtail-driven micro-jiggle); proposal: keep <= 0.15
# RENDERER hint (spring_proposal.json TASTEFUL_CHANGE chest_visual_cap): while chest is applied as a
# whole-sprite squash, cap the VISIBLE effect at ~1.5% (3 px on 400 px) even if the spring reaches 12 px.
render_visual_cap_px = 3.0

# --- Tail: PROCEDURAL OVERLAY (not a spring.rs channel). phys_tail.txt, phys_tail_heart.txt.
[tail]
mode = "overlay"
figure8_period_s = [2.5, 4.0]   # phys_tail 2.5-3 s, phys_tail_heart 3-4 s; harness uses mid 3.0
figure8_period_default_s = 3.0
figure8_amp_x_px = 10.0         # Lissajous x = Ax sin(wt)
figure8_amp_y_px = 5.0          # y = Ay sin(2wt) (figure-8 / S-curve)
inhale_lift_px = 6.0            # tail lifts 2-3 cm on inhale (2.4 px/cm sprite-native)
tip_spring = { stiffness = 90.0, damping = 9.0, max_velocity = 600.0, max_offset = 40.0 }  # zeta 0.47: excited bounce
flick_light = -160.0            # tail_tip_y impulse (px/s, up = negative): ~ 12 px peak (5 cm)
flick_strong = -330.0           # ~ 25 px peak (8-12 cm "happy flick")
flick_x_ratio = 0.35            # sideways component of a flick ("small figure-8 loop / whip")
heart_scale_pulse = 0.065       # heart expands 5-8% on inhale
heart_glow_base = 0.5
heart_glow_breath = 0.2
heart_glow_flare = 0.5          # added on tap, decays with tau
heart_glow_tau_s = 0.25
trail_s = 0.3                   # glowing trail lifetime after a flick

# --- Horns: PROCEDURAL OVERLAY. phys_horns.bin.txt, phys_horn_nebula.txt.
[horn]
mode = "overlay"
tilt_follow = 0.8               # horn_tilt = LOCAL horn-layer tilt on top of the sprite rotation: target = angle * follow ...
tilt_spring = { stiffness = 120.0, damping = 14.0, max_velocity = 6.0, max_offset = 0.07 }  # ... lagged; output clamped to +-0.07 rad (4 deg, brief 2-4 deg)
nebula_period_s = [6.0, 8.0]
nebula_period_default_s = 7.0
nebula_left_dir = 1.0           # clockwise
nebula_right_dir = -1.0         # counter-clockwise
nebula_inhale_mult = 0.8        # slows/condenses on inhale
nebula_exhale_mult = 1.2        # accelerates on exhale
burst_mult = 3.0                # sudden acceleration on tap ...
burst_s = 0.5                   # ... for 0.4-0.6 s
burst_sparks = [8, 12]          # star sparks from tips, pulled back inward
star_twinkle_s = [1.0, 2.0]
rim_glow_base = 0.5
rim_glow_flare = 0.5
rim_glow_tau_s = 0.3
spike_lift_px = 2.0             # strong events: tips lift for 0.5 s
spike_s = 0.5

# --- Tattoos (phys_tattoo.txt, phys_tattoo_particles.txt).
[tattoo]
glow_base = 0.55
glow_breath = 0.15              # brighten on inhale, dim on exhale
wave_zones = ["chest", "stomach", "arms", "thighs"]
wave_zone_delay_s = 0.15        # chest -> stomach -> arms/thighs
flare_light = 0.35
flare_strong = 0.6              # "longer brighter ripple" on press-stab
flare_tau_light_s = 0.35
flare_tau_strong_s = 0.6
particles_per_tap = [6, 10]     # radial spray
particle_travel_px = [5.0, 10.0]  # 2-4 cm sprite-native
particle_trail_s = 0.3
particle_life_s = [0.6, 1.0]
idle_drift_per_breath = [1, 3]  # lazy cyan particles on exhale
palette = ["cyan", "magenta"]   # lillith-anim particles::PALETTE names; cyan->magenta near knife

# --- Facial micro-expressions (phys_facial_micro_expressions.bin.txt, phys_breathing.txt).
[face]
blink_every_s = [4.0, 6.0]
blink_close_s = 0.15
lazy_blink_close_s = 0.4        # Sleepy / teasing
tongue_peek_s = 0.2
tongue_peek_long_s = 0.4        # Mischievous / teasing
tongue_every_n_taps = [3, 4]
tongue_on_exhale_chance = 0.25
wink_on_strong_tap_chance = 0.3
oh_widen_s = 0.3                # eyes widen + "oh!" on strong taps/events
brow_raise_px = 3.0             # 2-3 mm brow raise (layered art only)

# --- Heartbeat opacity pulse (README-SP "Breathing + Heartbeat").
[heartbeat]
base_opacity = 0.93             # README-SP alpha
pulse_amplitude = 0.015         # (guess) subtle
bpm = 68.0                      # (guess)
dub_delay_s = 0.18              # lub-dub second beat
dub_ratio = 0.6

# --- Idle life (README-SP / repo idle.rs IdleConfig).
[idle]
transition_every_s = [8.0, 12.0]
transition_len_s = [1.2, 2.0]
reaction_every_s = [12.0, 26.0]
auto_gesture_cooldown_s = 2.5
family_order = ["hip_sway", "lean_forward", "shoulder_roll", "soft_reset"]
# spring_proposal.json baked_motion_audit: these clips BAKE their own body motion. When one of them
# actually plays, on_clip_start() applies only the step KICKS (secondary jiggle), not the targets,
# so motion is not doubled. When the animator stays on the idle clip, call start_transition(name)
# to run the full spring-target sequence instead.
baked_transition_clips = ["hip_sway", "lean_forward", "shoulder_roll"]

# --- Idle transitions as spring-target sequences (phys_idle_transitions.bin.txt,
# prompt_refined_idle_transitions.bin.txt). Each step eases targets over ramp_s
# (smoothstep) then holds for hold_s. Unlisted channels keep their current target.
# root_x + = toward the window (renderer flips with facing). Impulses fire at step start.
[[idle_transitions.hip_sway]]   # weight shift 4-6 cm over 1.5 s, lean 3-5 deg
ramp_s = 0.6
hold_s = 0.3
targets = { root_x = 6.0, angle = 0.02 }   # preview: 0.035 + root_x double-counted the lean (head ~18 px); now ~12 px
impulses = [ { channel = "pigtails", strength = -20.0, delay_s = 0.05 }, { channel = "chest", strength = 10.0, delay_s = 0.12 } ]   # pigtails trail the sway (preview: was +20)
[[idle_transitions.hip_sway]]
ramp_s = 0.6
hold_s = 0.1
targets = { root_x = 0.0, angle = 0.0 }
impulses = [ { channel = "pigtails", strength = 14.0, delay_s = 0.05 } ]   # trails the return (was -14)

[[idle_transitions.lean_forward]]  # torso 5-8 cm closer, head tilt 5 deg, hold, rock back 1.5-2 s
ramp_s = 0.5
hold_s = 0.6
targets = { root_x = 8.0, root_y = 2.0, angle = 0.02, scale = 1.01 }   # preview: 0.045 put the head ~26 px over with sheared shins; now ~15 px
impulses = [ { channel = "chest", strength = 14.0, delay_s = 0.12 } ]
[[idle_transitions.lean_forward]]  # rock back: "releases with an elegant bounce"
ramp_s = 0.6
hold_s = 0.1
targets = { root_x = 0.0, root_y = 0.0, angle = 0.0, scale = 1.0 }
impulses = [ { channel = "chest", strength = 25.0, delay_s = 0.15 }, { channel = "pigtails", strength = 20.0, delay_s = 0.1 } ]

[[idle_transitions.shoulder_roll]]  # one shoulder lifts 2 cm then the other + figure-8 hip 3 cm
ramp_s = 0.3
hold_s = 0.05
targets = { angle = 0.03, root_x = 2.0 }
impulses = [ { channel = "chest", strength = 30.0, delay_s = 0.1 }, { channel = "pigtails", strength = 35.0, delay_s = 0.05 } ]
fx = ["tail_flick_light", "horn_brighten", "wink"]
[[idle_transitions.shoulder_roll]]
ramp_s = 0.3
hold_s = 0.05
targets = { angle = -0.03, root_x = -2.0 }
impulses = [ { channel = "chest", strength = 24.0, delay_s = 0.1 }, { channel = "pigtails", strength = -35.0, delay_s = 0.05 } ]
[[idle_transitions.shoulder_roll]]
ramp_s = 0.4
hold_s = 0.1
targets = { angle = 0.0, root_x = 0.0 }

[[idle_transitions.soft_reset]]  # everything recentres, one relaxation bounce
ramp_s = 0.8
hold_s = 0.4
targets = { root_x = 0.0, root_y = 0.0, angle = 0.0, scale = 1.0 }
impulses = [ { channel = "chest", strength = 8.0, delay_s = 0.2 } ]

# --- Moods: multipliers (1.0 = neutral). Applied on top of [springs]/[gains]/[breathing]/...
# gain scales EVERY impulse (recipes, footfalls, breath kicks, tail flicks); it is applied on top of
# the per-channel [gains] at kick time and uses the NEW mood immediately (stiffness/damping/amplitudes blend).
# zeta (damping ratio) noted for chest so the feel is predictable.
[moods.Playful]       # bouncier: chest zeta 0.59 -> 0.50
stiffness = 1.0
damping = 0.85
gain = 1.15
idle_amplitude = 1.1   # transition targets + pigtail micro-sway
breath_period = 1.0
breath_amplitude = 1.0
tail_amplitude = 1.15
tail_speed = 1.1
nebula_speed = 1.1
glow = 1.05
blink_interval = 1.0
idle_interval = 0.9
[moods.Happy]         # warm, a touch livelier than neutral
stiffness = 1.0
damping = 0.95
gain = 1.05
idle_amplitude = 1.05   # transition targets + pigtail micro-sway
breath_period = 0.95
breath_amplitude = 1.05
tail_amplitude = 1.1
tail_speed = 1.05
nebula_speed = 1.0
glow = 1.1
blink_interval = 1.0
idle_interval = 1.0
[moods.Mischievous]   # loose + teasing: big tail, longer tongue peeks
stiffness = 1.05
damping = 0.9
gain = 1.1
idle_amplitude = 1.1   # transition targets + pigtail micro-sway
breath_period = 1.0
breath_amplitude = 1.0
tail_amplitude = 1.3
tail_speed = 1.2
nebula_speed = 1.15
glow = 1.1
blink_interval = 1.1
idle_interval = 0.85
[moods.Alert]         # snappier: higher freq, same-ish zeta, faster breathing, fewer idle transitions
stiffness = 1.3
damping = 1.1
gain = 1.15
idle_amplitude = 0.8   # transition targets + pigtail micro-sway
breath_period = 0.8
breath_amplitude = 0.9
tail_amplitude = 0.8
tail_speed = 1.4
nebula_speed = 1.5
glow = 1.25
blink_interval = 0.8
idle_interval = 1.5
[moods.Sleepy]        # heavy, near-critically damped (chest zeta ~0.95), slow deep breaths
stiffness = 0.7
damping = 1.35
gain = 0.6
idle_amplitude = 0.7   # transition targets + pigtail micro-sway
breath_period = 1.35
breath_amplitude = 1.2
tail_amplitude = 0.6
tail_speed = 0.6
nebula_speed = 0.6
glow = 0.7
blink_interval = 1.5
idle_interval = 1.6

[mood_blend]
blend_s = 1.0                   # multipliers lerp to the new mood over this long (no pops)

# --- Drag (spring_proposal.json TASTEFUL_CHANGE drag_hold): dangling sway with a soft landing.
[drag]
hold_angle_per_px_s = -0.0006   # angle target = clamp(vx * k, +-clamp) while held (vx = cursor px/s)
hold_angle_clamp = 0.12
pickup_recipe = "drag"
pickup_scale = 1.0
drop_recipe = "drag"
drop_scale = 0.8

# --- Mischief meter (README-SP; repo mood.rs Mischief rate 0.01/s, threshold 1.0).
[mischief]
rate_per_s = 0.01
threshold = 1.0
tail_amplitude_boost = 0.4      # tail_amp *= 1 + boost * level
pigtail_gain_boost = 0.1        # pigtail gain *= 1 + boost * level
tongue_chance_boost = 1.0       # tongue chance *= 1 + boost * level
spontaneous_flick_above = 0.6   # level above which the tail flicks on its own ...
spontaneous_flick_every_s = [6.0, 10.0]   # ... this often
on_threshold_event = "mischief.interrupt"
on_threshold_mood = "Mischievous"
on_threshold_mood_s = 20.0

# --- Impulse recipes. Peak comments are at NEUTRAL mood gain 1.0 (Playful, the default mood, runs ~15% hotter).
# strength = channel units/s before gains; delay_s from trigger.
# double_ratio != 0 => re-kick of ratio*strength after double_delay_s (double bounce / double jiggle).
# double_delay_s omitted => [chest].double_jiggle_delay_s for chest, [pigtails].double_bounce_delay_s for pigtails.
# Tiers high/medium/low == lillith-anim animator.rs kick_for() values (pigtail -> pigtails).
[impulse_recipes.high]
impulses = [
  { channel = "root_y", strength = -90.0 },
  { channel = "angle", strength = 0.6, signed = true },
  { channel = "scale", strength = 0.35 },
  { channel = "chest", strength = 70.0, delay_s = 0.12, double_ratio = 0.5 },
  { channel = "pigtails", strength = -90.0, delay_s = 0.05, signed = true, double_ratio = 0.5 },  # negative = trails the body sway (repo +90)
]
fx = ["tail_flick_strong", "horn_burst", "horn_spike", "tattoo_flare_strong", "particles", "eyes_widen"]
[impulse_recipes.medium]
impulses = [
  { channel = "root_y", strength = -40.0 },
  { channel = "angle", strength = 0.3, signed = true },
  { channel = "scale", strength = 0.15 },
  { channel = "chest", strength = 40.0, delay_s = 0.12 },
  { channel = "pigtails", strength = -55.0, delay_s = 0.05, signed = true },  # trails (repo +55)
]
fx = ["tail_flick_light", "horn_burst", "tattoo_flare_light"]
[impulse_recipes.low]
impulses = [
  { channel = "angle", strength = 0.12, signed = true },
  { channel = "chest", strength = 18.0, delay_s = 0.12 },
  { channel = "pigtails", strength = -30.0, delay_s = 0.05, signed = true },  # trails (repo +30)
]
fx = ["tattoo_flare_light"]
# Knife tap (phys_knife_tap.txt, phys_pigtail_top, phys_bikini_top_jiggle): light tap = single jiggle 1-2 cm.
[impulse_recipes.knife_tap]
impulses = [
  { channel = "angle", strength = 0.2, signed = true },      # 2-3 cm upper-body sway -> ~0.55 deg whole sprite, head ~3-4 px (preview: 1.0 threw the head ~20 px)
  { channel = "root_x", strength = 25.0, signed = true },    # upper-body side sway 2-3 cm
  { channel = "chest", strength = 29.0, delay_s = 0.12 },     # ~1.8 px + echo ~0.2 => ~2.0 px neutral (1-2 cm)
  { channel = "pigtails", strength = -49.0, delay_s = 0.05, signed = true },  # ~4 px peak neutral (3-6 cm); negative = trails the sway
]
fx = ["tail_flick_light", "horn_burst", "tattoo_flare_light", "particles", "tongue_count"]
# Press-stab (0.3 s dwell): crisp double jiggle + pigtail double bounce.
[impulse_recipes.knife_tap_strong]
impulses = [
  { channel = "angle", strength = 0.35, signed = true },     # ~0.9 deg, head ~6-7 px (was 1.6: ~4 deg / 25 px, read as being shoved)
  { channel = "root_x", strength = 35.0, signed = true },
  { channel = "root_y", strength = 20.0 },                    # leans into the press
  { channel = "chest", strength = 48.0, delay_s = 0.12, double_ratio = 0.6 },   # 2nd jiggle ~42% of 1st (0.5 gave 35%: too faint once re-timed to 0.40 s) ; ~3.0 px + pigtail echo ~0.4 => ~3.4 px neutral (3 cm)
  { channel = "pigtails", strength = -76.0, delay_s = 0.05, signed = true, double_ratio = 0.6 },  # ~6.2 px neutral (5-6 cm); trails the sway; 2nd bounce ~44% (0.5 -> 37% after re-time)
]
fx = ["tail_flick_strong", "horn_burst", "tattoo_flare_strong", "particles", "eyes_widen", "wink_chance", "tongue_count"]
# Notification / alert jolt (pigtail "Reactive Alert Variation": whip + sharper jiggle, then calm).
[impulse_recipes.alert_jolt]
impulses = [
  { channel = "root_y", strength = -60.0 },
  { channel = "scale", strength = 0.25 },
  { channel = "angle", strength = -0.4, signed = true },
  { channel = "chest", strength = 55.0, delay_s = 0.1, double_ratio = 0.4 },
  { channel = "pigtails", strength = 80.0, delay_s = 0.04, signed = true, double_ratio = 0.5 },
]
fx = ["horn_spike", "horn_burst", "tattoo_flare_strong", "eyes_widen"]
# Happy hop (tada / bt.paired / user.returned): two little hops.
[impulse_recipes.happy_hop]
impulses = [
  { channel = "root_y", strength = -110.0, double_ratio = 0.6, double_delay_s = 0.45 },
  { channel = "scale", strength = 0.2 },
  { channel = "chest", strength = 50.0, delay_s = 0.12, double_ratio = 0.6, double_delay_s = 0.45 },
  { channel = "pigtails", strength = 60.0, delay_s = 0.06, double_ratio = -0.6, double_delay_s = 0.45 },
]
fx = ["tail_flick_strong", "tattoo_flare_light", "particles", "wink"]
# Sleepy sigh (idle.long / idle.asleep): slump, no bounce.
[impulse_recipes.sleepy_sigh]
impulses = [
  { channel = "root_y", strength = 25.0 },
  { channel = "scale", strength = -0.1 },
  { channel = "chest", strength = -12.0, delay_s = 0.2 },
]
fx = ["lazy_blink"]
# Drag pick-up / drop.
[impulse_recipes.drag]
impulses = [
  { channel = "root_y", strength = -50.0 },
  { channel = "pigtails", strength = 70.0, delay_s = 0.04, signed = true },
  { channel = "chest", strength = 45.0, delay_s = 0.08 },
]
fx = ["eyes_widen"]
# Stab (window.closed / click): sharp forward stab.
[impulse_recipes.stab]
impulses = [
  { channel = "root_x", strength = 60.0, signed = true },
  { channel = "angle", strength = 0.6, signed = true },      # = high tier (was 1.2: ~3 deg / 17 px head throw)
  { channel = "chest", strength = 45.0, delay_s = 0.12, double_ratio = 0.5 },
  { channel = "pigtails", strength = -65.0, delay_s = 0.05, signed = true },  # trails the stab
]
fx = ["tail_flick_strong", "horn_burst", "tattoo_flare_strong", "particles"]

# --- Clip-start mapping for on_clip_start(clip). Mirrors animator.rs HIGH_ENERGY/LOW_ENERGY.
# Lookup order: exact name -> prefix rules -> default.
[clip_recipes]
default = "medium"
# Kick lands on the clip's impact frame, not on clip start (knife_tap.json impact_frame 4 @ 10 fps = 0.4 s).
impact_delay_s = { knife_tap = 0.4 }
exact = { knife_tap = "knife_tap", dance = "high", tada_celebrate = "happy_hop", spell_orb_cast = "high", beam_cast = "high", wake = "high", event_cpu_busy = "high", event_error = "high", event_net_lost = "high", event_screenshot = "high", event_firewall_block = "high", event_input_click_double = "high", event_window_close = "stab", event_battery_low = "high", event_ram_high = "high", hip_sway = "none", lean_forward = "none", shoulder_roll = "none", soft_reset = "none", think = "low", nod = "low", blink_wink = "none", idle = "none", sleep = "sleepy_sigh", sit_swing = "low", event_loading = "low", event_incognito = "low", drag_held = "none", idle_flirt_hip_lean = "low", idle_flirt_pigtail_twirl = "low", idle_flirt_hands_behind_sway = "low", idle_flirt_stretch = "low", idle_flirt_glove_adjust = "low", idle_flirt_tail_curl = "low", idle_flirt_lip_bite = "low", idle_flirt_shy_giggle = "low", idle_flirt_foot_tap = "low", idle_flirt_look_away = "low" }  # drag kicks come from set_motion(Dragged) / [drag]; idle_flirt_* mannerisms (slow 5-8 fps holds) get a gentle start
# Idle-transition clips get their spring sequence from [idle_transitions] instead of a kick ("none").
locomotion_prefixes = ["walk", "run"]   # footfalls from [walk], no start kick beyond start_tip_angle

