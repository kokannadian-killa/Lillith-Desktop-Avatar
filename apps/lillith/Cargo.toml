[package]
name = "lillith"
description = "Lillith desktop companion: main binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "lillith"
path = "src/main.rs"

[features]
# Both overlay backends by default (Wayland needs libxkbcommon + libwayland at build time).
# Each backend also turns on `lillith-overlay/text` (cosmic-text labels for the
# right-click menu).
# Desktop idle (presence) comes with each backend: ext-idle-notify-v1 on
# Wayland, MIT-SCREEN-SAVER on X11 (both pure Rust).
default = ["wayland", "x11"]
wayland = ["lillith-overlay/wayland", "lillith-overlay/text", "lillith-sense/wayland-idle"]
x11 = ["lillith-overlay/x11", "lillith-overlay/text", "lillith-sense/x11"]
full = [
    "wayland",
    "x11",
    "lillith-overlay/text",
    "lillith-overlay/portal",
    "lillith-sense/bluetooth",
    "lillith-sense/pulse",
    "lillith-sense/journal",
    "lillith-sense/clipboard",
    "lillith-sense/x11",
    "lillith-voice/audio",
]

[dependencies]
lillith-core.workspace = true
lillith-anim.workspace = true
lillith-overlay.workspace = true
lillith-sense.workspace = true
lillith-mind.workspace = true
# `voice`: the speech worker + subprocess TTS engines (piper / espeak-ng /
# spd-say); no system libraries at build time, engines optional at runtime.
lillith-voice = { workspace = true, features = ["voice"] }
lillith-panel.workspace = true
lillith-tray.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
