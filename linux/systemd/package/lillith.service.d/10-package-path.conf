# Installed only by the Arch package (linux/PKGBUILD) next to the shared unit in
# /usr/lib/systemd/user/. The shared unit points at the portable install
# (%h/.local/bin/lillith, from linux/install.sh); the package puts the binary in
# /usr/bin, so this drop-in swaps the path. The portable install never gets the
# drop-in, so its unit is unchanged. An empty ExecStart= clears the inherited one.
[Service]
ExecStart=
ExecStart=/usr/bin/lillith
